<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repasos Viladecans</title>
<meta name="theme-color" content="#1a1a1a"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="apple-touch-icon" sizes="152x152" href="icon-152.png"><link rel="apple-touch-icon" sizes="167x167" href="icon-167.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Repasos Viladecans">
<script src="config.js"></script><script src="fb.js"></script>
<link href="inter.css" rel="stylesheet">
<style>
:root{--on:#ffffff;--hdr:rgba(255,255,255,.96);--plan:#fff;--a:#a59524;--k:#1a1a1a;--g1:#3d3d3d;--g2:#6b6b6b;--g3:#8a8a8a;--g4:#b8b8b8;--g5:#dcdcdc;--g6:#ececec;--g7:#f6f6f6;--w:#ffffff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;font-weight:300;color:var(--k);background:var(--w);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
b{font-weight:500}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.lbl{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--g3);font-weight:400}
header{border-bottom:1px solid var(--k);position:sticky;top:0;background:var(--hdr);backdrop-filter:blur(8px);z-index:20}
header{padding-top:env(safe-area-inset-top)}header .wrap{display:flex;justify-content:space-between;align-items:flex-end;padding-top:12px;padding-bottom:10px;gap:12px}
.logo{display:flex;flex-direction:column;line-height:1;cursor:pointer}
.logo .m{font-size:28px;font-weight:200;letter-spacing:.06em}.logo .s{font-size:6.3px;letter-spacing:.42em;margin-top:3px}
.ttl{text-align:right;line-height:1.1}.ttl .t{font-size:19px;font-weight:200}.ttl .sync{font-size:10px;letter-spacing:.12em;color:var(--g3);text-transform:uppercase}.sync.w{color:var(--a);font-weight:500}
.crumbs{font-size:12px;color:var(--g3);padding:12px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--g2);text-decoration:none;cursor:pointer}.crumbs a:hover{color:var(--k)}
h1{font-size:clamp(30px,6vw,46px);font-weight:200;letter-spacing:-.02em;line-height:1.05;margin:8px 0 4px}
h2{font-size:22px;font-weight:200;margin:0 0 4px}
.sub{color:var(--g2);font-size:13.5px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--g5);margin-top:18px;overflow-x:auto}
.tabs a{padding:10px 0;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--g3);text-decoration:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--k);border-color:var(--k);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--k);margin-top:18px}
.kpis div{padding:10px 0}.kpis .v{font-size:30px;font-weight:200;line-height:1.1}
.floor{display:grid;grid-template-columns:200px 1fr;gap:26px;padding:26px 0;border-bottom:1px solid var(--g6)}
@media(max-width:760px){.floor{grid-template-columns:1fr;gap:12px}}
.floor h3{font-size:24px;font-weight:200}
.kp{position:relative;max-width:440px;width:100%}
.kp img{width:100%;display:block}
.kp .u{position:absolute;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:background .2s;font-size:12px;line-height:1.1;text-align:center}
.kp .u:hover{background:rgba(26,26,26,.08)}
.kp .u b{font-size:15px;font-weight:400}
.kp .u small{font-size:10px;color:var(--g3)}
.kp .u .n{margin-top:3px;min-width:20px;height:20px;border-radius:10px;background:var(--k);color:var(--on);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.kp .u .n.ok{background:none;color:var(--k);border:1px solid var(--k)}
.ulist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.uc{border:1px solid var(--g5);background:var(--w);padding:7px 10px;font-size:12.5px;cursor:pointer;display:flex;gap:7px;align-items:center}
.uc:hover{border-color:var(--k)}
.uc .c{color:var(--g3)}
.dots{display:inline-flex;gap:2px}.dots i{width:7px;height:7px;border-radius:50%;display:block}
/* vivienda */
.vgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;margin-top:18px;align-items:start}
@media(max-width:900px){.vgrid{grid-template-columns:1fr}}
.pv{border:1px solid var(--g5);position:relative;background:var(--w)}
.pvs{overflow:auto;max-height:72vh}
.pi{position:relative;width:100%;transform-origin:0 0}
.pi img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.tag{position:absolute;transform:translate(-50%,-50%);background:var(--k);color:var(--on);font-size:11px;padding:4px 8px;white-space:nowrap;cursor:pointer;letter-spacing:.02em;border:0;display:flex;gap:6px;align-items:center;opacity:.92}
.tag em{font-style:normal;background:var(--w);color:var(--k);border-radius:8px;padding:0 5px;font-size:10px;font-weight:500}
.tag.l{background:var(--hdr);color:var(--k);border:1px solid var(--k)}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);color:var(--on);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.pin.hecho{border:3px double #fff}
.pin.validado{opacity:.35}
.pin.tmp{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.25)}}
.pvbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid var(--g5);gap:8px;flex-wrap:wrap}
.zb{display:flex;gap:4px}
.zb button,.seg button{border:1px solid var(--g4);background:var(--w);padding:5px 10px;font-size:12px;cursor:pointer}
.seg{display:flex}.seg button+button{border-left:0}.seg button.on{background:var(--k);color:var(--on);border-color:var(--k)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12px;color:var(--g2)}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%;display:block}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--g5);border:1px solid var(--g5)}
.zone{background:var(--w);padding:14px;cursor:pointer;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s}
.zone:hover{background:var(--g7)}
.zone h4{font-weight:400;font-size:15px}
.zone .cnt{font-size:28px;font-weight:200;line-height:1}
.zone .row{display:flex;justify-content:space-between;align-items:flex-end}
.zone.gen{grid-column:span 2;background:var(--g7)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px;border-top:1px solid var(--k);padding-top:10px}
.meta p{font-size:14px;font-weight:400}
/* zona */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:16px 0}
.cat{border:1px solid var(--g5);background:var(--w);padding:14px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:84px;justify-content:space-between}
.cat:hover{border-color:var(--k)}
.cat.on{background:var(--k);color:var(--on);border-color:var(--k)}
.cat.on .lbl{color:var(--g4)}
.cat .nm{font-size:14px;font-weight:400;line-height:1.25}
.cat .ft{display:flex;justify-content:space-between;align-items:center}
.cat .ft i{width:10px;height:10px;border-radius:50%;display:block}
.cat .ct{font-size:20px;font-weight:200}
.add{width:100%;border:1px dashed var(--g2);background:var(--w);padding:16px;cursor:pointer;font-size:14px;letter-spacing:.02em;margin:6px 0 12px}
.add:hover{background:var(--g7)}
.rp{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--g6);cursor:pointer;align-items:center}
.rp .ph{width:64px;height:64px;background:var(--g6);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--g3);font-size:10px}
.rp .ph img{width:100%;height:100%;object-fit:cover}
.rp .ph i{position:absolute;left:4px;top:4px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;font-style:normal;font-size:9px;color:var(--on);font-weight:600;display:flex;align-items:center;justify-content:center}
.rp .tx{font-size:14px;line-height:1.35}
.rp .tx small{display:block;color:var(--g3);font-size:11.5px;margin-top:2px}
.st{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--g4);padding:3px 7px;white-space:nowrap;color:var(--g2)}
.st.hecho{border-color:var(--k);color:var(--k)}.st.validado{background:var(--k);color:var(--on);border-color:var(--k)}
.empty{color:var(--g3);font-size:13.5px;padding:24px 0;text-align:center}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(26,26,26,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sh{background:var(--w);width:100%;max-width:640px;max-height:94vh;overflow-y:auto;padding:20px 18px 26px;border-radius:16px 16px 0 0}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:4px}}
.sh h3{font-size:22px;font-weight:200;margin-bottom:2px}
.fld{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--g5);background:var(--w);padding:7px 10px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--k);color:var(--on);border-color:var(--k)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
textarea{width:100%;border:1px solid var(--g4);font:inherit;font-size:15px;padding:10px;min-height:84px;resize:vertical;outline:none}
textarea:focus{border-color:var(--k)}
.txrow{display:flex;gap:8px;align-items:stretch;margin-top:6px}
.mic{width:54px;border:1px solid var(--k);background:var(--w);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.mic svg{width:22px;height:22px;stroke:var(--k);fill:none;stroke-width:1.3}
.mic.rec{background:var(--k)}.mic.rec svg{stroke:var(--on)}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photos .p{width:82px;height:82px;background:var(--g6);position:relative;overflow:hidden}
.photos .p img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photos .p button{position:absolute;right:2px;top:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:var(--on);font-size:13px;cursor:pointer;line-height:1}
.photos label{width:82px;height:82px;border:1px dashed var(--g2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--g2);cursor:pointer;gap:4px}
.photos label svg{width:22px;height:22px;stroke:var(--g2);fill:none;stroke-width:1.2}
.btns{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.btn{background:var(--k);color:var(--on);border:1px solid var(--k);padding:12px 18px;font-size:13.5px;cursor:pointer;font-weight:400}
.btn.o{background:var(--w);color:var(--k)}
.btn.d.danger{background:#b3261e;color:#fff;border-color:#b3261e}.btn.d{background:var(--w);color:var(--g2);border-color:var(--g4);margin-left:auto}
.btn:disabled{opacity:.4}
.pinrow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--g5);padding:10px 12px;margin-top:6px;font-size:13px;cursor:pointer}
.full{position:fixed;inset:0;background:var(--w);z-index:60;display:none;flex-direction:column}
.full.on{display:flex}
.full .top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--k);gap:10px}
.full .pvs{flex:1;max-height:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--k);color:var(--on);padding:10px 16px;font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:96vw;max-height:92vh}
.ind{display:grid;grid-template-columns:14px 1fr auto auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--g6)}
.ind i{width:14px;height:14px;border-radius:50%;display:block}
.ind input{border:0;border-bottom:1px solid transparent;font:inherit;font-size:14.5px;padding:3px 0;outline:none;width:100%;background:none}
.ind input:focus{border-color:var(--k)}
.ind .n{font-size:22px;font-weight:200;min-width:34px;text-align:right}
.ind button{border:1px solid var(--k);background:var(--w);padding:6px 10px;font-size:11.5px;cursor:pointer}
.zcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--g5);border:1px solid var(--g5);margin-top:20px}
.zcg .zone{min-height:130px}
.grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--g3);margin:22px 0 2px;display:flex;justify-content:space-between;border-bottom:1px solid var(--k);padding-bottom:6px}
input.loc{width:100%;border:0;border-bottom:1px solid var(--g4);font:inherit;font-size:15px;padding:8px 0;outline:none}
footer{margin-top:60px;border-top:1px solid var(--k);padding:16px 0 30px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--g3);gap:10px;flex-wrap:wrap}
@media(max-width:520px){.kpis .lbl{letter-spacing:.05em;font-size:9.5px}.tag{font-size:9px;padding:2px 5px}.tag em{font-size:8.5px}}
footer .logo .m{font-size:12px}footer .logo .s{font-size:4px}

/* acento Euroconstruc */
.elogo{height:34px;width:auto;cursor:pointer;display:block}
header{border-bottom:3px solid var(--a)!important}
.kpis{border-top:2px solid var(--a)!important}
.kpis div:nth-child(2) .v{color:var(--a)}
.tabs a.on{border-color:var(--a)!important}
.floor h3::before{content:"";display:block;width:28px;height:3px;background:var(--a);margin-bottom:10px}
.kp .u .n{background:var(--a)!important}
.kp .u .n.ok{background:var(--w)!important;color:var(--k);border-color:var(--a)!important}
.kp .u:hover{background:rgba(165,149,36,.12)!important}
.uc:hover,.cat:hover{border-color:var(--a)!important}
.grp{border-bottom-color:var(--a)!important}
.meta{border-top:2px solid var(--a)!important}
.cat.on{box-shadow:inset 0 -4px 0 var(--a)}
.add{border-color:var(--a)!important}
.add:hover{background:rgba(165,149,36,.08)!important}
.st.hecho{border-color:var(--a)!important;color:#7d7019!important}
.tag em{background:var(--a)!important;color:var(--on)!important}
.btn:not(.o):not(.d){background:var(--k);box-shadow:inset 0 -3px 0 var(--a)}
.zone .cnt{color:var(--k)}
.zone:hover{box-shadow:inset 3px 0 0 var(--a)}
.crumbs a:hover{color:var(--a)!important}
.full .top:first-child{border-bottom:3px solid var(--a)!important}
footer{border-top:2px solid var(--a)!important}
@media(max-width:520px){.elogo{height:28px}.tabs{gap:14px}.tabs a{font-size:10.5px;letter-spacing:.08em}.ttl .sync{max-width:200px;margin-left:auto}}

/* desplegables */
.flbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px}
.lnk{background:none;border:0;font-size:12px;letter-spacing:.06em;color:var(--k);border-bottom:1px solid var(--a);cursor:pointer;padding:2px 0}
.fl{border-bottom:1px solid var(--g5)}
.fl:first-of-type{border-top:1px solid var(--g5)}
.flh{width:100%;background:none;border:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 2px;cursor:pointer;text-align:left}
.flh:hover{background:var(--g7)}
.fln{display:flex;align-items:center;gap:14px;min-width:0}
.flc{width:42px;height:42px;border:1px solid var(--k);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:400;flex:none;transition:background .25s,color .25s}
.fl.open .flc{background:var(--k);color:var(--on);box-shadow:inset 0 -3px 0 var(--a)}
.fln b{display:block;font-weight:400;font-size:16px}.fln small{display:block;font-size:11.5px;color:var(--g3)}
.flst{display:flex;align-items:center;gap:12px;flex:none}
.flnum{font-size:22px;font-weight:200;line-height:1;text-align:right}.flnum small{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--g3);text-transform:uppercase}
.flst .sbar{width:90px}
.chev{width:20px;height:20px;stroke:var(--k);fill:none;stroke-width:1.4;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.fl.open .chev{transform:rotate(180deg)}
.flb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.2,.7,.2,1)}
.fl.open .flb{grid-template-rows:1fr}
.flbi{overflow:hidden;min-height:0}
.flbi .floor{grid-template-columns:1fr 1fr;border:0;padding:4px 0 22px;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s}
.fl.open .flbi .floor{opacity:1;transform:none}
@media(max-width:760px){.flbi .floor{grid-template-columns:1fr}.flst .sbar{width:56px}.flst .dots{display:none}}
.uc .cn{background:var(--a);color:var(--on);font-size:11px;padding:0 6px;border-radius:9px}
.uc.ok{border-color:var(--k)}
/* barras de estado */
.sbar{display:flex;gap:2px;height:8px;width:100%;background:transparent}
.sbar.big{height:14px;margin:14px 0 4px}
.sbar i{display:block;height:100%;min-width:0}
.sbar i:first-child{border-radius:3px 0 0 3px}.sbar i:last-child{border-radius:0 3px 3px 0}.sbar i:only-child{border-radius:3px}
.sbar .s1{background:#c9c9c9}.sbar .s2{background:var(--a)}.sbar .s3{background:var(--k)}.sbar .s0{background:var(--g6)}
.sbar i[style*="width:0%"]{display:none}
/* progreso */
.pg-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.pg-hero .big{font-size:clamp(34px,8vw,54px);font-weight:200;line-height:1}.pg-hero .big small{font-size:.45em;margin-left:2px}.pg-hero .big.a{color:var(--a)}
.pgr{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 56px;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--g6);cursor:pointer}
.pgr:hover{background:var(--g7)}
.pgr.sm{padding:9px 0}
.pgn{display:flex;gap:10px;align-items:center;min-width:0}.pgn i{width:12px;height:12px;border-radius:50%;flex:none}
.pgn b{font-weight:400;font-size:14px}.pgn small{display:block;font-size:11px;color:var(--g3)}
.pgb small{display:block;font-size:11px;color:var(--g2);margin-top:6px}
.pgp{font-size:24px;font-weight:200;text-align:right}.pgp small{font-size:12px}
.best{font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--a);color:var(--on);padding:2px 6px;margin-left:4px;vertical-align:2px}
@media(max-width:560px){.pgr{grid-template-columns:1fr 50px}.pgr .pgb{grid-column:1/-1;order:3}}
.lc{position:relative;margin-top:10px}.lc svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip,#gtip{position:absolute;display:none;background:var(--k);color:var(--on);font-size:11.5px;padding:6px 9px;pointer-events:none;line-height:1.4;z-index:30;top:6px}
#gtip{position:fixed}

/* login y usuario */
body.locked{overflow:hidden}
#login{position:fixed;inset:0;background:var(--w);z-index:100;overflow-y:auto;border-top:4px solid var(--a)}
.lgw{max-width:420px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 24px 40px}.lgicon{width:84px;height:84px;border-radius:19px;display:block;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.lgu{display:grid;gap:10px;margin-top:12px}
.lgu button{display:flex;align-items:center;gap:14px;border:1px solid var(--g5);background:var(--w);padding:14px;font-size:17px;cursor:pointer;text-align:left}
.lgu button:hover{border-color:var(--a)}
.lgu span{width:38px;height:38px;border-radius:50%;background:var(--k);color:var(--on);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:inset 0 -3px 0 var(--a)}
.lgm{margin-top:14px;font-size:13.5px;color:#7d7019;font-weight:400}
.who{font-size:11px;color:var(--g2);margin-top:3px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.who span{font-weight:500;color:var(--k)}.who em.ro{font-style:normal;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--a);color:var(--on);padding:1px 6px}
.who button{background:none;border:0;border-bottom:1px solid var(--g4);font-size:10.5px;color:var(--g2);cursor:pointer;padding:0}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pdfb{padding:9px 16px;font-size:12.5px;letter-spacing:.08em;flex:none}
.sel{width:100%;margin-top:8px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--g4);background:var(--w);color:var(--k)}
.ind input.im{font-size:12.5px;color:var(--g1);margin-top:4px;border-bottom:1px dashed var(--g4)}
.ind input.im:placeholder-shown{color:var(--g3)}
.steps{margin:12px 0 8px 18px;font-size:14px;line-height:1.7;color:var(--g1)}

/* boton inicio */
#homeBtn{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;display:none;align-items:center;gap:8px;background:var(--k);color:var(--on);border:0;border-radius:28px;padding:13px 20px 13px 16px;font-size:14px;font-weight:500;letter-spacing:.02em;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.28),inset 0 -3px 0 var(--a)}
#homeBtn svg{width:22px;height:22px;stroke:var(--on);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#homeBtn.on{display:flex}
#homeBtn:active{transform:scale(.96)}
body.locked #homeBtn{display:none}
/* instalar */
#instBar{position:fixed;left:0;right:0;bottom:0;z-index:110;display:none;background:var(--w);border-top:3px solid var(--a);box-shadow:0 -6px 24px rgba(0,0,0,.15);padding:16px calc(18px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
#instBar.on{display:block}
.ib{max-width:620px;margin:0 auto;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}
.ib img{width:56px;height:56px;border-radius:13px}
.ib b{font-size:15px;font-weight:500}.ib p{font-size:13.5px;color:var(--g1);margin-top:3px;line-height:1.45}
.ib .shi{display:inline-block;vertical-align:-4px;width:18px;height:18px;stroke:#0a7aff;fill:none;stroke-width:1.8}
.ibb{display:flex;gap:8px;margin-top:10px;grid-column:1/-1;justify-content:flex-end}

/* modo oscuro */
body.dark{--k:#ececec;--g1:#cfcfcf;--g2:#a8a8a8;--g3:#8c8c8c;--g4:#5e5e5e;--g5:#3a3a3a;--g6:#2b2b2b;--g7:#202020;--w:#141414;--on:#141414;--hdr:rgba(20,20,20,.94);--a:#c2b03a;color-scheme:dark}

body.dark .pv,body.dark .kp img,body.dark .pi img{background:#fff}
body.dark .kp img{border-radius:2px}
body.dark .kp .u b,body.dark .kp .u small{color:#1a1a1a}
body.dark .kp .u .n.ok{background:#fff!important;color:#1a1a1a}
body.dark .sbar .s1{background:#5a5a5a}
body.dark .lb{background:rgba(0,0,0,.95)}
body.dark #homeBtn{box-shadow:0 6px 20px rgba(0,0,0,.6),inset 0 -3px 0 var(--a)}
body.dark .ov{background:rgba(0,0,0,.65)}
body.dark input,body.dark select,body.dark textarea{color:var(--k);background:var(--w)}
.thm{background:none;border:1px solid var(--g4);border-radius:14px;width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--k)}
.thm svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

/* ayuda */
#help{position:fixed;inset:0;z-index:120;background:var(--w);display:none;overflow-y:auto}
#help.on{display:block}
body.helpon #homeBtn,body.helpon #instBar{display:none!important}
.hw{max-width:980px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column}
.hh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--a);padding-bottom:10px}
.hh h3{font-size:clamp(22px,4vw,30px);font-weight:200;margin-top:4px}
.hx{background:none;border:1px solid var(--g4);width:40px;height:40px;border-radius:20px;font-size:16px;cursor:pointer;color:var(--k);flex:none}
.hb{display:grid;grid-template-columns:1fr;gap:18px;margin-top:16px;flex:1}
.himg{background:var(--g7);border:1px solid var(--g5);display:flex;align-items:center;justify-content:center;padding:8px}
.himg img{max-width:100%;max-height:58vh;object-fit:contain;display:block;cursor:zoom-in;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.hl{list-style:none;counter-reset:h;margin:0;padding:0}
.hl li{counter-increment:h;position:relative;padding:8px 0 10px 44px;font-size:15.5px;line-height:1.5;border-bottom:1px solid var(--g6);color:var(--g1)}
.hl li::before{content:counter(h);position:absolute;left:0;top:7px;width:30px;height:30px;border-radius:50%;background:#c5aa28;color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
@media(min-width:900px) and (orientation:landscape){.hb{grid-template-columns:1.25fr 1fr;align-items:start}.himg img{max-height:72vh}}
.hf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.hdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hdots i{width:9px;height:9px;border-radius:50%;background:var(--g5);cursor:pointer;display:block}
.hdots i.on{background:var(--a);width:22px;border-radius:5px}
.hpdf{text-align:center;margin-top:16px}.hpdf a{color:var(--k);font-size:13px;border-bottom:1px solid var(--a);text-decoration:none;padding-bottom:2px}
.thm.hlp{font-size:13px;font-weight:600;font-family:inherit}
</style>

function zonesOf(u){
  const z=[];
  u.rooms.forEach(r=>{
    if(r.n.startsWith('Estar')){z.push({k:'cocina',n:'Cocina',t:'cocina',x:r.x,y:r.y-3.6});z.push({k:'estar',n:'Estar-comedor',t:'estancia',x:r.x,y:r.y+3.6});}
    else if(r.n.startsWith('Baño')){z.push({k:'bano'+(r.n.split(' ')[1]||''),n:r.n,t:'bano',x:r.x,y:r.y});}
    else if(r.n.startsWith('Dormitorio')){z.push({k:'dorm'+(r.n.split(' ')[1]||''),n:r.n,t:'estancia',x:r.x,y:r.y});}
    else z.push({k:r.n=='Vestíbulo'?'vest':'dist',n:r.n,t:'estancia',x:r.x,y:r.y});
  });
  const ord=k=>k=='cocina'?0:k.startsWith('bano')?1:k=='estar'?2:k.startsWith('dorm')?3:4;
  z.sort((a,b)=>ord(a.k)-ord(b.k)||a.k.localeCompare(b.k));
  z.push({k:'terraza',n:'Terraza',t:'terraza'});
  z.push({k:'generales',n:'Generales vivienda',t:'generales'});
  return z;
}

function sha256(s){s=unescape(encodeURIComponent(s));function r(v,a){return(v>>>a)|(v<<(32-a))}const mp=Math.pow,mw=mp(2,32);let res='',words=[],abl=s.length*8,hash=[],k=[],pc=0,ic={};for(let c=2;pc<64;c++){if(!ic[c]){for(let i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}s+='\x80';while(s.length%64-56)s+='\x00';for(let i=0;i<s.length;i++){const j=s.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((abl/mw)|0);words[words.length]=abl;for(let j=0;j<words.length;){const w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0),t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}for(let i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}return res}

const IMGC={};
function imgEl(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src})}
async function jpg(src,max,q){const key=src+'|'+max;if(IMGC[key])return IMGC[key];const im=await imgEl(src);const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return IMGC[key]={d:c.toDataURL('image/jpeg',q||.72),w:c.width,h:c.height}}
async function planPins(u,recs){
  const im=await imgEl('planos/'+u.id+'.jpg');const s=Math.min(1,1500/im.naturalWidth);const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const nums=pinNums(u.id);const R=Math.max(10,c.width*.014);
  recs.filter(r=>r.x!=null).forEach(r=>{const px=r.x/100*c.width,py=r.y/100*c.height;x.beginPath();x.arc(px,py,R,0,7);x.fillStyle=indOf(r.ind).c;x.fill();x.lineWidth=R*.25;x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.font=`bold ${Math.round(R*1.05)}px Helvetica,Arial`;x.textAlign='center';x.textBaseline='middle';x.fillText(String(nums[r.id]||''),px,py+1)});
  return {d:c.toDataURL('image/jpeg',.8),w:c.width,h:c.height};
}
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function pdfTitle(o){return o.amb=='viv'?'Vivienda '+uName(U[o.ref]):o.amb=='planta'?FLN[o.ref]:o.amb=='zc'?'Zonas comunes':'Bloque 5 completo'}

function pdfName(o){const d=new Date();const t=pdfTitle(o).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[º]/g,'').replace(/[^\w]+/g,'-');const i=o.ind?'_'+(indOf(o.ind).e||indOf(o.ind).g).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-'):'';return `Repasos_B5_${t}${i}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.pdf`}
async function buildPDF(o,prog){
  const JS=await loadJsPDF();const doc=new JS({unit:'mm',format:'a4',compress:true});
  const W=210,M=15,BOT=282;let y=0;const A=[165,149,36],K=[26,26,26],G=[138,138,138];
  const recs=pdfRecs(o);const title=pdfTitle(o);const CB=[];
  let logo=null;try{logo=await jpg('logo-euroconstruc.png',700,.9)}catch(e){}
  const head=()=>{if(logo){const h=8,w=h*logo.w/logo.h;doc.addImage(logo.d,'JPEG',M,10,w,h)}doc.setFont('helvetica','normal');doc.setTextColor(...K);doc.setFontSize(15);doc.text('Repasos · '+title,W-M,15,{align:'right'});doc.setFontSize(7.5);doc.setTextColor(...G);doc.text('Residencial Vila Llevant · Bloque 5 · Viladecans',W-M,19.5,{align:'right'});doc.setDrawColor(...A);doc.setLineWidth(.7);doc.line(M,23,W-M,23);y=31};
  const need=h=>{if(y+h>BOT){doc.addPage();head()}};
  head();
  // resumen
  const cnt=e=>recs.filter(r=>r.estado==e).length;
  const info=[['Ámbito',title],['Industrial',o.ind?indOf(o.ind).n:'Todos los industriales'],['Incluye',o.est=='pend'?'Pendientes y hechos':'Todos los estados'],['Fecha',new Date().toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})],['Generado por',uN(CUR)||'—']];
  doc.setFontSize(7);info.forEach((r,i)=>{const x=M+i*36;doc.setTextColor(...G);doc.text(r[0].toUpperCase(),x,y);doc.setTextColor(...K);doc.setFontSize(9);doc.text(doc.splitTextToSize(r[1],34),x,y+4.5);doc.setFontSize(7)});
  y+=15;doc.setDrawColor(220);doc.setLineWidth(.2);doc.line(M,y,W-M,y);y+=8;
  [['Repasos',recs.length],['Pendientes',cnt('pendiente')],['Hechos',cnt('hecho')],['Validados',cnt('validado')]].forEach((k,i)=>{const x=M+i*45;doc.setFontSize(7);doc.setTextColor(...G);doc.text(k[0].toUpperCase(),x,y);doc.setFontSize(20);doc.setTextColor(...(i==1?A:K));doc.text(String(k[1]),x,y+9)});
  y+=16;
  if(recs.length){doc.setFillColor(246,244,232);doc.rect(M,y-4,W-2*M,11,'F');doc.setDrawColor(...K);doc.setLineWidth(.35);doc.rect(M+3,y-1.5,4.5,4.5);doc.setLineWidth(.5);doc.line(M+3,y-1.5,M+7.5,y+3);doc.line(M+7.5,y-1.5,M+3,y+3);doc.setFontSize(8);doc.setTextColor(...K);doc.text('Marca la casilla HECHO de cada repaso cuando esté terminado: la casilla y el texto quedan tachados.',M+11,y+.6);doc.setFontSize(7);doc.setTextColor(...G);doc.text('Ábrelo con Adobe Acrobat Reader (gratis), con Archivos en iPad/iPhone o en el navegador, marca y guarda el PDF.',M+11,y+4.2);y+=13}
  if(!o.ind&&recs.length){const st=IND.map(i=>({i,l:recs.filter(r=>r.ind==i.id)})).filter(s=>s.l.length);
    doc.setFontSize(7);doc.setTextColor(...G);doc.text('INDUSTRIAL',M,y);['PEND.','HECHOS','VALID.'].forEach((t,k)=>doc.text(t,W-M-40+k*16,y,{align:'right'}));y+=2;doc.setDrawColor(...K);doc.setLineWidth(.3);doc.line(M,y,W-M,y);y+=5;
    st.forEach(s=>{need(6);doc.setFillColor(...hex2rgb(s.i.c));doc.circle(M+1.5,y-1.2,1.4,'F');doc.setFontSize(9);doc.setTextColor(...K);doc.text(s.i.n,M+5,y);['pendiente','hecho','validado'].forEach((e,k)=>doc.text(String(s.l.filter(r=>r.estado==e).length),W-M-40+k*16,y,{align:'right'}));y+=2;doc.setDrawColor(230);doc.setLineWidth(.2);doc.line(M,y,W-M,y);y+=4.5});y+=4}
  if(!recs.length){doc.setFontSize(11);doc.setTextColor(...G);doc.text('No hay repasos con estos filtros.',M,y+6)}
  // grupos
  const groups=[];
  DATA.units.slice().sort((a,b)=>FLOORS.indexOf(a.fl)-FLOORS.indexOf(b.fl)||a.door-b.door).forEach(u=>{const l=recs.filter(r=>r.u==u.id);if(l.length)groups.push({u,l})});
  ZC.forEach(([k,n])=>{const l=recs.filter(r=>r.u=='ZC'&&r.z==k);if(l.length)groups.push({zc:n,l})});
  let done=0;const total=recs.length;
  for(const g of groups){
    need(30);
    doc.setFillColor(...K);doc.rect(M,y,W-2*M,8,'F');doc.setFillColor(...A);doc.rect(M,y+8,W-2*M,.8,'F');
    doc.setTextColor(255);doc.setFontSize(10.5);doc.text(g.u?`Vivienda ${uName(g.u)}  ·  ${FLN[g.u.fl]}  ·  Tipología ${g.u.tip}`:`Zonas comunes  ·  ${g.zc}`,M+3,y+5.4);doc.setFontSize(8.5);doc.text(`${g.l.length} repaso${g.l.length>1?'s':''}`,W-M-3,y+5.4,{align:'right'});y+=13;
    const nums=g.u?pinNums(g.u.id):{};
    if(o.planos&&g.u&&g.l.some(r=>r.x!=null)){try{const p=await planPins(g.u,g.l);let w=W-2*M,h=w*p.h/p.w;if(h>110){h=110;w=h*p.w/p.h}need(h+4);doc.addImage(p.d,'JPEG',M+(W-2*M-w)/2,y,w,h);y+=h+5}catch(e){}}
    const sorted=g.l.slice().sort((a,b)=>(nums[a.id]||999)-(nums[b.id]||999)||a.ts-b.ts);
    for(const r of sorted){
      const i=indOf(r.ind);const fotos=o.fotos?vis(r).slice(0,3):[];const tw=fotos.length?W-2*M-23-fotos.length*25:W-2*M-23;
      doc.setFontSize(9.5);const lines=doc.splitTextToSize(r.txt||'(sin descripción)',tw);
      const th=5+lines.length*4.2+5;const rh=Math.max(th,fotos.length?25:0,12)+3;need(rh);
      doc.setDrawColor(...K);doc.setLineWidth(.35);doc.rect(M,y,7,7);doc.setFontSize(5.5);doc.setTextColor(...G);doc.text('HECHO',M+3.5,y+9.6,{align:'center'});
      doc.setFillColor(...hex2rgb(i.c));doc.circle(M+13,y+3.5,3.2,'F');doc.setTextColor(255);doc.setFontSize(7.5);doc.text(String(nums[r.id]||'·'),M+13,y+4.6,{align:'center'});
      const tx=M+20;CB.push({p:doc.getNumberOfPages(),id:r.id,box:[M,y,7,7],st:[tx,y+3.9,tw,lines.length*4.2],n:lines.length,done:r.estado!='pendiente'});doc.setTextColor(...G);doc.setFontSize(7.5);doc.text(`${zoneName(r)}  ·  ${r.cat}${r.loc?'  ·  '+r.loc:''}`.toUpperCase(),tx,y+2.5);
      doc.setTextColor(...K);doc.setFontSize(9.5);doc.text(lines,tx,y+7.2);
      const my=y+7.2+lines.length*4.2;doc.setFontSize(7.5);doc.setTextColor(...G);doc.text(`${i.n}   ·   ${ESTN[r.estado]}   ·   ${uN(r.autor)||'—'}   ·   ${new Date(r.ts).toLocaleDateString('es-ES')}`,tx,my);
      if(r.estado!='pendiente'){doc.setTextColor(...(r.estado=='hecho'?A:K));doc.text(ESTN[r.estado].toUpperCase(),tx+tw,y+2.5,{align:'right'})}
      let fx=W-M-fotos.length*25+2;for(const f of fotos){try{const p=await jpg(await fotoURL(f),500,.7);const s=23,w=p.w>=p.h?s:s*p.w/p.h,h=p.w>=p.h?s*p.h/p.w:s;doc.addImage(p.d,'JPEG',fx+(s-w)/2,y+(s-h)/2,w,h)}catch(e){doc.setDrawColor(220);doc.rect(fx,y,23,23)}fx+=25}
      y+=rh;doc.setDrawColor(230);doc.setLineWidth(.2);doc.line(M,y-1.5,W-M,y-1.5);
      done++;prog&&prog(done,total);
    }
    y+=4;
  }
  const n=doc.getNumberOfPages();for(let p=1;p<=n;p++){doc.setPage(p);doc.setFontSize(7);doc.setTextColor(...G);doc.text('Grup Euroconstruc · Obra 2403 Viladecans · Repasos Bloque 5',M,290);doc.text(`${p} / ${n}`,W-M,290,{align:'right'})}
  return await addChecks(doc.output('arraybuffer'),CB);
}

function loadPdfLib(){if(window.PDFLib)return Promise.resolve(PDFLib);return new Promise((res,rej)=>{const s=document.createElement('script');s.src='pdf-lib.min.js';s.onload=()=>window.PDFLib?res(PDFLib):rej(new Error('pdflib'));s.onerror=()=>rej(new Error('pdflib'));document.head.appendChild(s)})}
setTimeout(()=>loadPdfLib().catch(()=>{}),3500);
async function addChecks(buf,CB){
  if(!CB.length)return new Blob([buf],{type:'application/pdf'});
  let L;try{L=await loadPdfLib()}catch(e){return new Blob([buf],{type:'application/pdf'})}
  const {PDFDocument,rgb,pushGraphicsState,popGraphicsState,setStrokingColor,setFillingColor,setLineWidth,setLineCap,moveTo,lineTo,stroke,rectangle,fill,LineCapStyle}=L;
  const pdf=await PDFDocument.load(buf);const form=pdf.getForm();const pages=pdf.getPages();const k=72/25.4;
  const ink=rgb(0.1,0.1,0.1),red=rgb(0.70,0.15,0.12),paper=rgb(1,1,1);
  const boxOps=(w,h,on)=>{const o=[pushGraphicsState(),setFillingColor(paper),rectangle(0,0,w,h),fill(),setStrokingColor(ink),setLineWidth(1),rectangle(.5,.5,w-1,h-1),stroke()];if(on){o.push(setStrokingColor(red),setLineWidth(2.2),setLineCap(LineCapStyle.Round),moveTo(3,3),lineTo(w-3,h-3),stroke(),moveTo(3,h-3),lineTo(w-3,3),stroke())}o.push(popGraphicsState());return o};
  const strikeOps=(w,h,n,on)=>{if(!on)return [];const o=[pushGraphicsState(),setStrokingColor(red),setLineWidth(1.3)];const lh=h/n;for(let i=0;i<n;i++){const yy=h-(i+0.55)*lh;o.push(moveTo(0,yy),lineTo(w,yy),stroke())}o.push(popGraphicsState());return o};
  CB.forEach((c,idx)=>{
    const pg=pages[c.p-1];const H=pg.getHeight();
    const cb=form.createCheckBox('hecho_'+(idx+1)+'_'+c.id);
    const [bx,by,bw,bh]=c.box;cb.addToPage(pg,{x:bx*k,y:H-(by+bh)*k,width:bw*k,height:bh*k,borderWidth:0});
    const [sx,sy,sw,sh]=c.st;cb.addToPage(pg,{x:sx*k,y:H-(sy+sh)*k,width:sw*k,height:sh*k,borderWidth:0});
    if(c.done)cb.check();
    const ws=cb.acroField.getWidgets();
    cb.updateAppearances((field,widget)=>{const r=widget.getRectangle();const isBox=Math.abs(r.width-r.height)<1;
      return {normal:isBox?{on:boxOps(r.width,r.height,true),off:boxOps(r.width,r.height,false)}:{on:strikeOps(r.width,r.height,c.n,true),off:strikeOps(r.width,r.height,c.n,false)}}});
  });
  const bytes=await pdf.save({updateFieldAppearances:false});
  return new Blob([bytes],{type:'application/pdf'});
}

function addMail(m){const cur=(PO.mail||'').split(/[,;\s]+/).filter(Boolean);if(!cur.includes(m))cur.push(m);PO.mail=cur.join(', ');$('#pdfMail').value=PO.mail}
function pmsg(t){const e=$('#pdfMsg');if(e)e.innerHTML=t}
async function ensurePDF(btn){
  if(PDFBLOB)return PDFBLOB;const lbl=btn.textContent;btn.disabled=true;
  try{PDFBLOB=await buildPDF(PO,(d,t)=>{btn.textContent=`Preparando… ${d}/${t}`});return PDFBLOB}
  catch(e){pmsg(e.message=='jspdf'?'No se ha podido cargar el generador de PDF: abre la app con cobertura una vez.':'Error al crear el PDF.');throw e}
  finally{btn.disabled=false;btn.textContent=lbl}
}
async function pdfDownload(){
  const btn=$('#pdfDl');let blob;try{blob=await ensurePDF(btn)}catch(e){return}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=pdfName(PO);a.target='_blank';document.body.appendChild(a);a.click();a.remove();
  pmsg(`PDF listo (${Math.round(blob.size/1024)} KB). Si no se ha abierto, <a href="${url}" target="_blank" download="${pdfName(PO)}">pulsa aquí</a>.`);
}
function mailText(){const t=pdfTitle(PO),ind=PO.ind?indOf(PO.ind):null,n=pdfRecs(PO).length;

function mailTo(){return (PO.mail||'').split(/[,;\s]+/).map(s=>s.trim()).filter(s=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s))}
async function pdfSend(){
  const to=mailTo();if(!to.length){pmsg('Escribe al menos un email válido.');return}
  const btn=$('#pdfSend');let blob;try{blob=await ensurePDF(btn)}catch(e){return}
  const file=new File([blob],pdfName(PO),{type:'application/pdf'});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  SHAREFILE=file;
  pmsg(`<b>PDF preparado.</b> ${canShare?`Pulsa «Abrir Mail», elige <b>Mail</b> y pega el destinatario en «Para» (ya está copiado: ${esc(to.join(', '))}).`:'Pulsa «Abrir correo»: se descarga el PDF y se abre tu correo con el destinatario y el texto; adjunta el PDF descargado.'}<div class="btns"><button class="btn" onclick="pdfShareNow()">${canShare?'Abrir Mail':'Abrir correo'}</button></div>`);

let SHAREFILE=null;

const DAY=864e5;
function fmtD(d){return d==null?'—':d<1?'<1 día':d.toFixed(1).replace('.',',')+' días'}
function stackBar(p,h,v,big){const t=p+h+v;if(!t)return `<span class="sbar ${big?'big':''}"><i class="s0" style="width:100%"></i></span>`;return `<span class="sbar ${big?'big':''}"><i class="s3" style="width:${v/t*100}%" data-tip="Validados: ${v}"></i><i class="s2" style="width:${h/t*100}%" data-tip="Hechos: ${h}"></i><i class="s1" style="width:${p/t*100}%" data-tip="Pendientes: ${p}"></i></span>`}
function indStats(){
  const now=Date.now();
  return IND.map(i=>{const l=of(r=>r.ind==i.id);const p=l.filter(r=>r.estado=='pendiente'),h=l.filter(r=>r.estado=='hecho'),v=l.filter(r=>r.estado=='validado');
    const resp=l.filter(r=>r.tHecho&&r.ts).map(r=>(r.tHecho-r.ts)/DAY);
    const age=p.map(r=>(now-(r.ts||now))/DAY);
    return {i,tot:l.length,p:p.length,h:h.length,v:v.length,res:h.length+v.length,pct:l.length?(h.length+v.length)/l.length:0,
      resp:resp.length?resp.reduce((a,b)=>a+b,0)/resp.length:null,old:age.length?Math.max(...age):null,rech:l.reduce((n,r)=>n+(r.rech||0),0)}
  }).filter(s=>s.tot).sort((a,b)=>b.pct-a.pct||(a.resp??99)-(b.resp??99)||b.tot-a.tot);
}
function lineChart(){
  const l=all();if(l.length<2)return '<div class="empty">La evolución aparecerá cuando haya más repasos.</div>';
  const t0=Math.min(...l.map(r=>r.ts||Date.now()));const d0=new Date(t0);d0.setHours(0,0,0,0);
  const days=Math.max(1,Math.ceil((Date.now()-d0)/DAY));const N=Math.min(days,90);const start=Date.now()-N*DAY;
  const pts=[];for(let k=0;k<=N;k++){const t=start+k*DAY;pts.push({t,a:l.filter(r=>(r.ts||0)<=t).length,r:l.filter(r=>(r.tHecho||r.tValid)&&(r.tHecho||r.tValid)<=t).length})}
  const W=640,H=200,pl=34,pr=12,pt=12,pb=26;const max=Math.max(1,...pts.map(p=>p.a));
  const X=k=>pl+(W-pl-pr)*k/N,Y=v=>pt+(H-pt-pb)*(1-v/max);
  const path=key=>pts.map((p,k)=>(k?'L':'M')+X(k).toFixed(1)+','+Y(p[key]).toFixed(1)).join('');
  const ticks=[0,Math.round(max/2),max];
  return `<div class="lc"><svg viewBox="0 0 ${W} ${H}" id="lcs">
   ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--g6)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="13" style="fill:var(--g3)">${v}</text>`).join('')}
   <text x="${pl}" y="${H-6}" font-size="13" style="fill:var(--g3)">${new Date(start).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}</text><text x="${W-pr}" y="${H-6}" font-size="13" style="fill:var(--g3)" text-anchor="end">hoy</text>
   <path d="${path('a')}" fill="none" style="stroke:var(--k)" stroke-width="2" vector-effect="non-scaling-stroke"/>
   <path d="${path('r')}" fill="none" style="stroke:var(--a)" stroke-width="2" vector-effect="non-scaling-stroke"/>
   <line id="lcx" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#8a8a8a" stroke-dasharray="3 3" opacity="0"/>
  </svg><div class="tip" id="lct"></div></div>
  <div class="legend"><span><i style="background:var(--k)"></i>Repasos apuntados (acumulado)</span><span><i style="background:var(--a)"></i>Resueltos por el industrial (acumulado)</span></div>
  <script type="application/json" id="lcd">${JSON.stringify({pts,N,pl,pr,W})}<\/script>`;
}
function progresoHTML(){
  const l=all();const c=e=>l.filter(r=>r.estado==e).length;const tot=l.length;
  const st=indStats();const pct=tot?Math.round(c('validado')/tot*100):0;const pres=tot?Math.round((c('hecho')+c('validado'))/tot*100):0;
  let h=`<div class="pg-hero"><div><span class="lbl">Validados</span><div class="big">${pct}<small>%</small></div></div><div><span class="lbl">Resueltos por industriales</span><div class="big a">${pres}<small>%</small></div></div><div><span class="lbl">Total repasos</span><div class="big">${tot}</div></div></div>
  ${stackBar(c('pendiente'),c('hecho'),c('validado'),true)}
  <div class="legend"><span><i style="background:var(--g4);border-radius:2px"></i>Pendiente · ${c('pendiente')}</span><span><i style="background:var(--a);border-radius:2px"></i>Hecho · ${c('hecho')}</span><span><i style="background:var(--k);border-radius:2px"></i>Validado · ${c('validado')}</span></div>

    <div class="pgb">${stackBar(s.p,s.h,s.v)}<small>${s.res}/${s.tot} resueltos · respuesta media ${fmtD(s.resp)}${s.p?' · más antiguo '+fmtD(s.old):''}${s.rech?' · '+s.rech+' rechazo'+(s.rech>1?'s':''):''}</small></div>
    <div class="pgp">${Math.round(s.pct*100)}<small>%</small></div></div>`).join('');

  const zc=of(r=>r.u=='ZC');const zg=e=>zc.filter(r=>r.estado==e).length;
  h+=`<div class="pgr sm" onclick="go('zonas')"><div class="pgn"><div><b>Zonas comunes</b></div></div><div class="pgb">${stackBar(zg('pendiente'),zg('hecho'),zg('validado'))}</div><div class="pgp">${zg('pendiente')+zg('hecho')}</div></div>`;
  h+=`<div class="grp"><span>Evolución</span><span>últimos días</span></div>${lineChart()}`;
  return h;
}
function wireCharts(){
  const d=$('#lcd'),svg=$('#lcs');if(!d||!svg)return;const o=JSON.parse(d.textContent);const tip=$('#lct'),x=$('#lcx');
  const mv=e=>{const r=svg.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const vx=cx/r.width*o.W;let k=Math.round((vx-o.pl)/(o.W-o.pl-o.pr)*o.N);k=Math.max(0,Math.min(o.N,k));const p=o.pts[k];const px=o.pl+(o.W-o.pl-o.pr)*k/o.N;x.setAttribute('x1',px);x.setAttribute('x2',px);x.setAttribute('opacity',1);tip.style.display='block';tip.style.left=Math.min(r.width-150,Math.max(0,px/o.W*r.width-70))+'px';tip.innerHTML=`<b>${new Date(p.t).toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}</b><br>Apuntados ${p.a}<br>Resueltos ${p.r}`};
  const out=()=>{x.setAttribute('opacity',0);tip.style.display='none'};
  svg.addEventListener('mousemove',mv);svg.addEventListener('touchmove',mv,{passive:true});svg.addEventListener('mouseleave',out);svg.addEventListener('touchend',out);
}
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const g=$('#gtip');if(!g)return;if(t){g.textContent=t.dataset.tip;g.style.display='block';const r=t.getBoundingClientRect();g.style.left=Math.min(innerWidth-140,r.left+r.width/2-50)+'px';g.style.top=(r.top-30)+'px'}else g.style.display='none'});

  if(!SR)return fallback();
  try{rec=new SR();rec.lang='es-ES';rec.interimResults=false;rec.continuous=true;
   rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){const s=e.results[i][0].transcript.trim();t.value=(t.value.trim()?t.value.trim()+' ':'')+s.charAt(0).toUpperCase()+s.slice(1);F.txt=t.value}}};
   rec.onerror=fallback;rec.onend=()=>stopDict();rec.start();$('#micB').classList.add('rec');toast('Escuchando… toca otra vez para parar');

async function eliminarRep(id){
  if(RO()||!id)return;const r=viewRec(id)||{};closeSheet();
  const fotos=[...new Set([...(r.fotos||[]),...(r.ocultas||[])])];
  for(const k of Object.keys(JN)){const o=JN[k];if(RUN.has(k))continue;if((o.col=='repasos'&&o.doc==id)||((o.col=='fotos'||o.col=='historial')&&o.data&&o.data.rid==id)){delete JN[k];try{await iDel('journal',k)}catch(e){}try{localStorage.removeItem('rp-j-'+k)}catch(e){}}}
  for(const f of fotos){if(!f.startsWith('data:')){await jAdd({del:true,col:'fotos',doc:f});try{await iDel('fotos',f)}catch(e){}delete FOTO[f]}}
  await jAdd({del:true,col:'repasos',doc:id});
  HIST.filter(h=>h.rid==id).forEach(h=>{});
  if(online&&AUTHED){try{const ids=await FBK.idsWhere('historial','rid',id);for(const h of ids)await jAdd({del:true,col:'historial',doc:h})}catch(e){}}
  else await jAdd({del:true,col:'_pendhist',doc:id,data:{rid:id}});
  delete SERVER[id];PENDREC.delete(id);render();toast('Repaso eliminado');
}

/* tema claro / oscuro */
function isDark(){try{const v=localStorage.getItem('rp-theme');if(v)return v=='dark'}catch(e){}return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}
function applyTheme(){const d=isDark();document.body.classList.toggle('dark',d);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#141414':'#1a1a1a'}
function thmBtn(){return `<button class="thm" onclick="toggleTheme()" title="Modo claro / oscuro" aria-label="Cambiar a modo ${isDark()?'claro':'oscuro'}">${isDark()?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'}</button>`}
function toggleTheme(){try{localStorage.setItem('rp-theme',isDark()?'light':'dark')}catch(e){}applyTheme();updUser()}
applyTheme();

/* ayuda / tutorial */
const HELP=[
 {"img":"01_acceso","t":"Entra con tu nombre","p":["Elige tu usuario.","La primera vez pulsa «Es mi primera vez» y crea tu contraseña (mínimo 4 caracteres). Después la app te recuerda."]},
 {"img":"02_inicio","t":"Elige planta y vivienda","p":["Toca una planta para desplegarla: verás las viviendas y cuántos repasos pendientes tiene cada una.","Toca la vivienda en la lista o directamente en el plano de la planta.","Botón PDF: informe de todo el bloque."]},
 {"img":"03_vivienda","t":"El plano de la vivienda","p":["Toca una estancia del plano (Cocina, Baño, Dormitorio…) para entrar en ella.","Cada punto de color es un repaso. El color indica el industrial y el número, el orden.","Debajo tienes todas las estancias con sus pendientes, más Terraza y Generales."]},
 {"img":"04_estancia","t":"Dentro de cada estancia","p":["Elige el elemento: muebles, encimera, electrodomésticos, grifería…","Pulsa «+ Nuevo repaso» para apuntar un desperfecto.","Toca cualquier repaso de la lista para verlo o cambiarlo."]},
 {"img":"05_nuevo","t":"Apunta el repaso","p":["Elige el elemento afectado.","Escribe el fallo o usa las palabras rápidas (Rayado, Mancha, Bisagra…).","Dicta con el micrófono o con el micro del teclado.","Añade una o varias fotos.","Marca el punto exacto en el plano. El industrial se asigna solo y puedes cambiarlo."]},
 {"img":"06_punto","t":"Marca dónde está","p":["Toca el plano en el lugar del desperfecto: aparece el punto con el color del industrial.","Pulsa «Confirmar» y luego «Guardar repaso»."]},
 {"img":"07_estado","t":"Hecho, validado o eliminado","p":["Cambia el estado: Pendiente → Hecho (el industrial lo ha reparado) → Validado (revisado y correcto).","«Eliminar» borra un repaso apuntado por error (toca dos veces para confirmar)."]},
 {"img":"08_progreso","t":"Progreso de la obra","p":["Porcentaje validado, resuelto por los industriales y total de repasos.","Industriales ordenados por cómo responden: % resuelto, tiempo medio y repaso más antiguo."]},
 {"img":"09_pdf","t":"PDF por vivienda, planta o industrial","p":["Elige el ámbito: vivienda, planta, zonas comunes o el bloque completo, y un industrial o todos.","«Descargar PDF» genera el informe con planos, puntos y fotos.","«Preparar email»: escribe o toca el email del industrial y se abre tu correo con el PDF adjunto."]},
 {"img":"14_pdf_casilla","t":"El industrial tacha lo que ha hecho","p":["Cada repaso del PDF tiene una casilla HECHO. Al marcarla, la casilla y el texto quedan tachados.","Funciona con Adobe Acrobat Reader (gratis), con Archivos en iPad/iPhone y en el navegador. Después hay que guardar el PDF."]},
 {"img":"10_industriales","t":"Industriales","p":["Nombre de la empresa y email de cada gremio, para enviarle los PDF.","«Ver lista»: todos sus repasos pendientes y «Copiar lista para WhatsApp»."]},
 {"img":"11_cobertura","t":"Sin cobertura no se pierde nada","p":["Arriba ves el estado: «sincronizado» o «sin cobertura · X en el dispositivo». Todo se guarda en el dispositivo y se sube solo al volver la señal.","Botón «Inicio»: vuelve a la página principal desde cualquier pantalla.","Botón luna/sol: modo oscuro o claro."]},
 {"img":"12_oscuro","t":"Modo oscuro","p":["Pulsa la luna para trabajar en modo oscuro y el sol para volver al claro. Cada dispositivo lo recuerda."]},
 {"img":"13_instalar","t":"Instálala en el iPad","p":["Abre la web en Safari, pulsa Compartir (cuadrado con flecha) → «Añadir a pantalla de inicio».","Queda con su icono, se abre a pantalla completa y funciona sin cobertura."]}
]
;let HI=0;
function openHelp(i){HI=i||0;drawHelp();$('#help').classList.add('on');document.body.classList.add('helpon')}
function closeHelp(){$('#help').classList.remove('on');document.body.classList.remove('helpon')}
function helpGo(d){HI=Math.max(0,Math.min(HELP.length-1,HI+d));drawHelp()}
function drawHelp(){const s=HELP[HI];$('#help').innerHTML=`<div class="hw"><div class="hh"><div><span class="lbl">Tutorial · paso ${HI+1} de ${HELP.length}</span><h3>${s.t}</h3></div><button class="hx" onclick="closeHelp()" aria-label="Cerrar">✕</button></div>
 <div class="hb"><div class="himg"><img src="ayuda/${s.img}.jpg" alt="" onclick="lb(this.src)"></div><ol class="hl">${s.p.map(x=>`<li>${x}</li>`).join('')}</ol></div>
 <div class="hf"><button class="btn o" onclick="helpGo(-1)" ${HI==0?'disabled':''}>Anterior</button><div class="hdots">${HELP.map((x,i)=>`<i class="${i==HI?'on':''}" onclick="helpGo(${i-HI})"></i>`).join('')}</div><button class="btn" onclick="${HI==HELP.length-1?'closeHelp()':'helpGo(1)'}">${HI==HELP.length-1?'Terminar':'Siguiente'}</button></div>
 <div class="hpdf"><a href="ayuda/Tutorial-Repasos-Viladecans.pdf" target="_blank" rel="noopener" download>Descargar el tutorial en PDF</a></div></div>`}
(()=>{let x0=null;document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#help .hb'))x0=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60)helpGo(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(!$('#help').classList.contains('on'))return;if(e.key=='ArrowRight')helpGo(1);if(e.key=='ArrowLeft')helpGo(-1);if(e.key=='Escape')closeHelp()})})();
/* boton de inicio en todas las pantallas */
function goHome(){if($('#ov').classList.contains('on'))closeSheet();homeTab='viviendas';location.hash='';render();scrollTo({top:0,behavior:'smooth'})}
function updHome(){const h=location.hash.slice(1);const b=$('#homeBtn');if(b)b.classList.toggle('on',!!h&&h!='viviendas')}
window.addEventListener('hashchange',updHome);
/* instalar en iPad / iPhone / Android */
const IS_STANDALONE=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let DEFERRED=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;showInstall()});
function instDismissed(){try{return Date.now()-(+localStorage.getItem('rp-inst')||0)<3*864e5}catch(e){return false}}
function showInstall(force){
  if(IS_STANDALONE)return;if(!force&&instDismissed())return;
  const shareIco='<svg class="shi" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg>';
  let txt;
  if(IS_IOS){const safari=/Safari/.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
    txt=safari?`Pulsa ${shareIco} <b>Compartir</b> (arriba, junto a la dirección) y elige <b>«Añadir a pantalla de inicio»</b>. Se abrirá a pantalla completa y funcionará sin cobertura.`:`Abre esta página en <b>Safari</b> para instalarla: pulsa ${shareIco} Compartir → <b>«Añadir a pantalla de inicio»</b>.`}
  else if(DEFERRED)txt='Instálala en este dispositivo para abrirla como una app y usarla sin cobertura.';
  else if(!force)return;
  else txt='En el menú del navegador, elige <b>«Instalar app»</b> o <b>«Añadir a pantalla de inicio»</b>.';
  const el=$('#instBar');el.innerHTML=`<div class="ib"><img src="apple-touch-icon.png" alt=""><div><b>Instala Repasos Viladecans</b><p>${txt}</p></div><div class="ibb">${DEFERRED&&!IS_IOS?'<button class="btn" onclick="doInstall()">Instalar</button>':''}<button class="btn o" onclick="hideInstall()">${IS_IOS?'Entendido':'Ahora no'}</button></div></div>`;el.classList.add('on');
}
function hideInstall(){$('#instBar').classList.remove('on');try{localStorage.setItem('rp-inst',Date.now())}catch(e){}}
async function doInstall(){if(!DEFERRED)return;DEFERRED.prompt();try{await DEFERRED.userChoice}catch(e){}DEFERRED=null;hideInstall()}
setTimeout(()=>showInstall(),2500);

render();updUser();updHome();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
